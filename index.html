<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=980" />
    <meta name="theme-color" content="#ffb347" />

    <title>Clash Bases — community library of CoC base layouts</title>
    <meta
      name="description"
      content="A community library of Clash of Clans base layouts. Browse, search, and open shared bases directly in-game."
    />

    <!-- Open Graph: rich-preview metadata read by Slack, Discord,
         iMessage, WhatsApp, LinkedIn, Bluesky, Mastodon, GitHub
         comments, etc. when someone pastes a link to the site. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clash Bases" />
    <meta
      property="og:description"
      content="Community library of Clash of Clans base layouts. Browse, search, and open shared bases directly in-game."
    />
    <meta property="og:image" content="favicon.svg" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link data-trunk rel="css" href="styles.css" />
    <link data-trunk rel="copy-file" href="bases.json" />
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link data-trunk rel="copy-file" href=".nojekyll" />
      <link data-trunk rel="copy-dir" href="robot" />
  </head>
  <body>
<div id="robot-wrap" style="display:flex;justify-content:center;padding-top:24px"><agent-robot-avatar id="robot" size="240" auto-sleep="0"></agent-robot-avatar></div>
<script type="module">import "/robot/agent-robot-avatar.js";const r=document.getElementById("robot");const m=["surprise","success","inspect","warning","bored","waiting","angry","failure","error"];const w=t=>new Promise(a=>setTimeout(a,t));(async()=>{let i=0;while(true){try{Promise.resolve(r.play(m[i%m.length])).catch(console.warn)}catch(e){}await w(3000);try{r.reset()}catch(e){}await w(800);i++}})()</script>
    <noscript>
      <p style="text-align:center;padding:2rem;color:#e8ecf3;background:#0f1218;font-family:sans-serif">
        Clash Bases is a Rust/WebAssembly app and needs JavaScript enabled.
        The catalogue source is at
        <a href="https://github.com/nschmeller/clash-bases" style="color:#6cb6ff">github.com/nschmeller/clash-bases</a>.
      </p>
    </noscript>
  </body>
</html>
