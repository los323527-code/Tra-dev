<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=980" />
    <meta name="theme-color" content="#ffb347" />

    <title>Clash Bases — community library of CoC base layouts</title>
    <meta
      name="description"
      content="A community library of Clash of Clans base layouts. Browse, search, and open shared bases directly in-game."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clash Bases" />
    <meta
      property="og:description"
      content="Community library of Clash of Clans base layouts. Browse, search, and open shared bases directly in-game."
    />
    <meta property="og:image" content="favicon.svg" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link data-trunk rel="css" href="styles.css" />
    <link data-trunk rel="copy-file" href="bases.json" />
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link data-trunk rel="copy-file" href=".nojekyll" />
      <link data-trunk rel="copy-dir" href="robot" />
  </head>
  <body>
<button id="m-toggle" aria-label="Music" style="position:fixed;top:12px;right:12px;z-index:10000;width:44px;height:44px;border:0;border-radius:50%;background:#ffb347;font-size:22px">🎵</button>
<div id="music-wrap" style="display:none;position:fixed;top:64px;right:12px;z-index:9999;width:min(330px,calc(100vw - 24px));background:#1a1f2b;border:1px solid #2c3346;border-radius:14px;padding:10px;font-family:sans-serif;color:#e8ecf3;font-size:14px">
  <div style="display:flex;gap:6px">
    <input id="m-q" placeholder="Search song..." style="flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid #2c3346;background:#0f1218;color:#e8ecf3">
    <button id="m-go" style="border:0;border-radius:8px;padding:8px 12px;background:#ffb347;color:#000;font-weight:bold">Search</button>
  </div>
  <div id="m-title" style="margin-top:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
  <audio id="m-a" controls preload="none" style="width:100%;margin-top:6px"></audio>
  <div id="m-list" style="max-height:220px;overflow:auto;margin-top:8px"></div>
</div>
<script>document.documentElement.appendChild(document.getElementById("music-wrap"));document.documentElement.appendChild(document.getElementById("m-toggle"))</script>
<script>(function(){
var APP="ClashBases",H="https://discoveryprovider.audius.co";
var $=function(i){return document.getElementById(i)};
var wrap=$("music-wrap"),tg=$("m-toggle"),q=$("m-q"),go=$("m-go"),list=$("m-list"),au=$("m-a"),ttl=$("m-title");
var tracks=[],cur=-1;
fetch("https://api.audius.co").then(function(r){return r.json()}).then(function(d){if(d.data&&d.data.length)H=d.data[Math.floor(Math.random()*d.data.length)]}).catch(function(){});
function playIdx(i){
  if(i<0||i>=tracks.length)return;
  cur=i;var t=tracks[i];
  ttl.textContent=t.title+" — "+t.user.name;
  au.src=H+"/v1/tracks/"+t.id+"/stream?app_name="+APP;
  au.play().catch(function(){});
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.user.name});
  }
}
if("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play",function(){au.play()});
  navigator.mediaSession.setActionHandler("pause",function(){au.pause()});
  navigator.mediaSession.setActionHandler("nexttrack",function(){playIdx(cur+1)});
  navigator.mediaSession.setActionHandler("previoustrack",function(){playIdx(cur-1)});
}
au.onended=function(){playIdx(cur+1)};
function search(){
  var t=q.value.trim();if(!t)return;list.textContent="Searching...";
  fetch(H+"/v1/tracks/search?query="+encodeURIComponent(t)+"&limit=15&app_name="+APP)
  .then(function(r){return r.json()}).then(function(d){
    list.textContent="";tracks=d.data||[];
    if(!tracks.length){list.textContent="No results";return}
    tracks.forEach(function(s,i){
      var b=document.createElement("button");
      b.textContent=s.title+" — "+s.user.name;
      b.style.cssText="display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:7px;margin-bottom:4px;background:#232a3a;color:#e8ecf3;font-size:13px";
      b.onclick=function(){playIdx(i)};
      list.appendChild(b)});
  }).catch(function(){list.textContent="Search failed"});
}
tg.onclick=function(){wrap.style.display=wrap.style.display==="none"?"block":"none"};
go.onclick=search;q.onkeydown=function(e){if(e.key==="Enter")search()};
})()</script>
<div id="robot-wrap" style="display:flex;justify-content:center;padding-top:24px"><agent-robot-avatar id="robot" size="240" auto-sleep="0" color="#ff9f1c"></agent-robot-avatar></div>
<script>document.documentElement.insertBefore(document.getElementById("robot-wrap"),document.body)</script>
<script type="module">import "/robot/agent-robot-avatar.js";const r=document.getElementById("robot");const m=["surprise","success","inspect","warning","bored","waiting","angry","failure","error"];const w=t=>new Promise(a=>setTimeout(a,t));(async()=>{let i=0;while(true){try{Promise.resolve(r.play(m[i%m.length])).catch(console.warn)}catch(e){}await w(3000);try{r.reset()}catch(e){}await w(800);i++}})()</script>
    <noscript>
      <p style="text-align:center;padding:2rem;color:#e8ecf3;background:#0f1218;font-family:sans-serif">
        Clash Bases is a Rust/WebAssembly app and needs JavaScript enabled.
        The catalogue source is at
        <a href="https://github.com/nschmeller/clash-bases" style="color:#6cb6ff">github.com/nschmeller/clash-bases</a>.
      </p>
    </noscript>
  </body>
</html>
