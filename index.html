<script src="https://www.youtube.com/iframe_api"></script>
<script>(function(){
var K="AIzaSyBFg35VyRQCkfcOPorvqTVNdEbFjKIWbb4";
var $=function(i){return document.getElementById(i)};
var wrap=$("music-wrap"),tg=$("m-toggle"),q=$("m-q"),go=$("m-go"),list=$("m-list"),box=$("m-player-box"),pp=$("m-pp"),ttl=$("m-title"),hint=$("m-hint");
var player=null,apiReady=false,pending=null,hintTimer=null;
window.onYouTubeIframeAPIReady=function(){apiReady=true;if(pending){start(pending.id,pending.title);pending=null}};
function dec(s){var e=document.createElement("textarea");e.innerHTML=s;return e.value}
function setIcon(){if(!player||!player.getPlayerState)return;pp.textContent=player.getPlayerState()===1?"⏸":"▶"}
function start(id,title){
  box.style.display="block";ttl.textContent=title;hint.style.display="none";
  clearTimeout(hintTimer);
  if(!apiReady){pending={id:id,title:title};ttl.textContent="Loading...";return}
  if(player){player.loadVideoById(id);player.unMute();player.playVideo()}
  else{player=new YT.Player("m-p",{width:"100%",height:"100%",videoId:id,
    playerVars:{autoplay:1,playsinline:1,rel:0,modestbranding:1},
    events:{onReady:function(e){e.target.unMute();e.target.setVolume(100);e.target.playVideo()},
            onStateChange:setIcon}})}
  hintTimer=setTimeout(function(){if(player&&player.getPlayerState&&player.getPlayerState()!==1)hint.style.display="block"},2500);
}
function search(){
  var t=q.value.trim();if(!t)return;list.textContent="Searching...";
  fetch("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=12&q="+encodeURIComponent(t)+"&key="+K)
  .then(function(r){return r.json()}).then(function(d){
    list.textContent="";
    if(d.error){list.textContent="Error: "+d.error.message;return}
    if(!d.items||!d.items.length){list.textContent="No results";return}
    d.items.forEach(function(s){
      var b=document.createElement("button");var title=dec(s.snippet.title);
      b.textContent=title;
      b.style.cssText="display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:7px;margin-bottom:4px;background:#232a3a;color:#e8ecf3;font-size:13px";
      b.onclick=function(){start(s.id.videoId,title)};
      list.appendChild(b)});
  }).catch(function(){list.textContent="Search failed"});
}
pp.onclick=function(){if(!player)return;hint.style.display="none";player.getPlayerState()===1?player.pauseVideo():player.playVideo();setTimeout(setIcon,300)};
tg.onclick=function(){wrap.style.display=wrap.style.display==="none"?"block":"none"};
go.onclick=search;q.onkeydown=function(e){if(e.key==="Enter")search()};
})()</script>
