<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra</title>
<style>
  :root{--bg1:#0f1033;--card-edge:#5a46a8;--gold1:#e8b46a;--gold2:#b8793a}
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    font-family:"Segoe UI",Roboto,"Noto Sans Khmer",sans-serif;color:#fff;
    background:linear-gradient(rgba(15,16,51,.15),rgba(15,16,51,.35)),url(bg.jpg) center/cover no-repeat fixed,var(--bg1);
    padding:16px 12px 32px;
  }
  .grid{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .card{
    background:linear-gradient(180deg,rgba(58,42,110,.82),rgba(43,32,88,.88));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:2px solid var(--card-edge);border-radius:28px;padding:20px 12px 18px;
    text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .icon{width:min(130px,100%);aspect-ratio:1;border-radius:24px;display:grid;place-items:center;font-size:64px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  img.icon{object-fit:cover;background:none}
  .music{background:linear-gradient(135deg,#d65a9a,#4b1f7a)}
  .name{width:100%;padding-top:12px;font-weight:700;font-size:18px;border-top:1px solid rgba(255,255,255,.12)}
  .btn{
    display:inline-block;text-decoration:none;color:#fff;
    background:linear-gradient(180deg,var(--gold1),var(--gold2));
    padding:12px 30px;border-radius:999px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  }
  .btn:active{transform:scale(.96)}
</style>
</head>
<body>
  <main class="grid">
    <section class="card">
      <img class="icon" src="tra.webp" alt="TraBases">
      <div class="name">TraBases</div>
      <a class="btn" href="https://tra-dev.vercel.app/">Open</a>
    </section>
    <section class="card">
      <div class="icon music" aria-hidden="true">🎵</div>
      <div class="name">Music</div>
      <a class="btn" href="https://t.me/IMTRA1BOT">Open</a>
    </section>
  </main>
</body>
</html>
