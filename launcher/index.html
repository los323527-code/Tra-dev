<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra</title>
<style>
  :root{--bg1:#0f1033;--edge:#5a46a8;--gold1:#e8b46a;--gold2:#b8793a}
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    font-family:"Segoe UI",Roboto,"Noto Sans Khmer",sans-serif;color:#fff;
    background:linear-gradient(rgba(15,16,51,.15),rgba(15,16,51,.35)),url(bg.jpg) center/cover no-repeat fixed,var(--bg1);
    padding:14px 8px 28px;
  }
  .grid{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .card{
    background:linear-gradient(180deg,rgba(58,42,110,.82),rgba(43,32,88,.88));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:2px solid var(--edge);border-radius:20px;padding:12px 6px 12px;
    text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .icon{width:100%;max-width:84px;aspect-ratio:1;border-radius:22%;display:grid;place-items:center;font-size:36px;box-shadow:0 4px 12px rgba(0,0,0,.45)}
  .music{background:linear-gradient(135deg,#d65a9a,#4b1f7a)}
  .topup{background:linear-gradient(135deg,#3fb6a8,#1b4f8a)}
  .name{width:100%;padding-top:8px;font-weight:700;font-size:13px;border-top:1px solid rgba(255,255,255,.12);overflow-wrap:anywhere}
  .btn{
    display:inline-block;text-decoration:none;color:#fff;
    background:linear-gradient(180deg,var(--gold1),var(--gold2));
    padding:7px 14px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  }
  .btn:active{transform:scale(.96)}
</style>
</head>
<body>
  <main class="grid">
    <section class="card">
      <div class="icon" role="img" aria-label="TraBases" style="background:url(coc.webp) center/144% no-repeat"></div>
      <div class="name">TraBases</div>
      <a class="btn" href="https://tra-dev.vercel.app/">Open</a>
    </section>
    <section class="card">
      <div class="icon music" aria-hidden="true">🎵</div>
      <div class="name">Music</div>
      <a class="btn" href="https://t.me/IMTRA1BOT">Open</a>
    </section>
    <section class="card">
      <div class="icon topup" aria-hidden="true">💎</div>
      <div class="name">Tratopup</div>
      <a class="btn" href="https://...">Open</a>
    </section>
  </main>
</body>
</html>
